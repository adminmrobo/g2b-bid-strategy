name: 매일 수집·배포

on:
  schedule:
    - cron: "23 20 * * *"   # 매일 05:23 (한국시간)
  workflow_dispatch:
    inputs:
      budget:
        description: "이번 실행의 API 호출 예산 (일일 한도 10,000회)"
        default: "8500"
      skip_collect:
        description: "수집 없이 화면만 다시 배포"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["docs/**", "collector/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      MY_BIZNO: ${{ secrets.MY_BIZNO }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 비밀값 확인
        run: |
          test -n "$SERVICE_KEY"  || { echo "::error::Settings → Secrets 에 SERVICE_KEY 를 넣어 주세요"; exit 1; }
          test -n "$APP_PASSWORD" || { echo "::error::Settings → Secrets 에 APP_PASSWORD 를 넣어 주세요"; exit 1; }

      - name: 수집 (이어받기)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_collect)
        run: >
          python -m collector.run collect
          --budget "${{ inputs.budget || vars.API_BUDGET || '8500' }}"
          --max-minutes "${{ vars.MAX_MINUTES || '300' }}"

      - name: 저장소에 커밋 (암호화된 store/)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name  "g2b-bot"
          git config user.email "g2b-bot@users.noreply.github.com"
          git add store
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: $(date '+%Y-%m-%d %H:%M') 수집"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: 앱 데이터 빌드
        run: |
          if ls store/scsbid/*/*.bin >/dev/null 2>&1; then
            python -m collector.run build
          else
            echo "::warning::아직 수집된 데이터가 없습니다. 첫 수집 후 화면이 열립니다."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
