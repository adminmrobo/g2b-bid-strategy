<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>입찰 전략실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#1d2321; --muted:#5f6864; --line:#dcdad3; --soft:#ecebe5;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#dcefe9; --warn:#b45309; --bad:#b42318; --good:#15803d;
  --chart1:#0f6b5c; --chart2:#c2410c; --chart3:#64748b;
  --mono:"IBM Plex Mono",ui-monospace,monospace; --sans:"IBM Plex Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121615; --panel:#1a201e; --ink:#e6ebe8; --muted:#9aa5a0; --line:#2c3532; --soft:#222a27;
  --accent:#4fbfa8; --accent-ink:#0c1412; --accent-soft:#1d3a33; --warn:#f59e0b; --bad:#f87171; --good:#4ade80;
  --chart1:#4fbfa8; --chart2:#fb923c; --chart3:#94a3b8; } }
:root[data-theme="dark"]{
  --bg:#121615; --panel:#1a201e; --ink:#e6ebe8; --muted:#9aa5a0; --line:#2c3532; --soft:#222a27;
  --accent:#4fbfa8; --accent-ink:#0c1412; --accent-soft:#1d3a33; --warn:#f59e0b; --bad:#f87171; --good:#4ade80;
  --chart1:#4fbfa8; --chart2:#fb923c; --chart3:#94a3b8; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
a{color:var(--accent)}

/* lock */
#lock{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lockbox{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.lockbox h1{font-size:20px;margin:0 0 4px}
.lockbox p{margin:0 0 20px;color:var(--muted);font-size:14px}
.lockbox input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-family:var(--mono);letter-spacing:.08em}
.lockbox input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;width:100%;margin-top:12px}
.err{color:var(--bad);font-size:14px;min-height:22px;margin-top:10px}

/* app */
#app{display:none}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0 8px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.filters{display:flex;flex-direction:column;gap:8px;padding:4px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .lbl{font-size:12px;color:var(--muted);width:44px;flex:none}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.ghost{border-style:dashed;color:var(--muted)}
.more{display:none;flex-wrap:wrap;gap:6px}
.more.open{display:flex}
#custom{display:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:4px}
#custom.open{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{padding:20px 0 60px}
.scope{font-size:13px;color:var(--muted);margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;font-family:var(--mono);margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 4px}
.card .lead{margin:0 0 14px;color:var(--muted);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.chartbox{position:relative;height:300px}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
@media (max-width:700px){.recs{grid-template-columns:1fr}}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rec.main{border-color:var(--accent);background:var(--accent-soft)}
.rec .t{font-size:13px;color:var(--muted)}
.rec .x{font-family:var(--mono);font-size:24px;font-weight:600}
.rec .d{font-size:13px}
.verdict{border-left:4px solid var(--muted);padding:10px 14px;background:var(--soft);border-radius:0 10px 10px 0;font-size:14px}
.verdict.good{border-left-color:var(--good)}
.verdict.bad{border-left-color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{color:var(--warn)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.out{font-family:var(--mono);font-size:20px;font-weight:600}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.progress{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--accent)}
.note{font-size:13px;color:var(--muted)}
footer{font-size:12px;color:var(--muted);padding:20px 0 40px}
</style>
</head>
<body>
<section id="lock">
  <form class="lockbox" id="lockform" autocomplete="off">
    <h1>입찰 전략실</h1>
    <p>내부 전용입니다. 비밀번호를 입력하면 데이터가 열립니다.</p>
    <input id="pw" type="password" inputmode="text" placeholder="비밀번호" aria-label="비밀번호" autofocus>
    <button class="btn primary" id="unlock" type="submit">열기</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>

<div id="app">
  <header class="top">
    <div class="wrap">
      <div class="bar">
        <div class="brand">입찰 전략실<small id="asof"></small></div>
        <div class="spacer"></div>
        <button class="iconbtn" id="theme" title="화면 밝기">밝기</button>
        <button class="iconbtn" id="lockbtn">잠그기</button>
      </div>
      <div class="filters">
        <div class="row" id="catrow"><span class="lbl">업종</span></div>
        <div class="more" id="morerow"></div>
        <div id="custom">
          <div class="grid">
            <div class="field"><label>포함 키워드 (쉼표, 하나라도)</label><input id="c_inc" placeholder="예: 전기, 변전"></div>
            <div class="field"><label>제외 키워드</label><input id="c_exc" placeholder="예: 통신, 물품"></div>
            <div class="field"><label>업무구분</label><select id="c_div"><option value="">전체</option><option>공사</option><option>용역</option></select></div>
            <div class="field"><label>투찰가능 업종 포함</label><input id="c_ind" placeholder="예: 전기공사업"></div>
            <div class="field"><label>발주기관 포함</label><input id="c_inst" placeholder="예: 한국전력, 교육청"></div>
            <div class="field"><label>참가가능 지역 포함</label><input id="c_rgn" placeholder="예: 경기"></div>
            <div class="field"><label>기초금액 하한 (억원)</label><input id="c_min" type="number" step="0.1" min="0"></div>
            <div class="field"><label>기초금액 상한 (억원)</label><input id="c_max" type="number" step="0.1" min="0"></div>
            <div class="field"><label>낙찰자결정방법 포함</label><input id="c_mth" placeholder="예: 적격심사"></div>
          </div>
        </div>
        <div class="row" id="perrow"><span class="lbl">기간</span></div>
      </div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
    </div>
  </header>
  <main class="wrap">
    <div class="scope" id="scope"></div>
    <div id="view"></div>
  </main>
  <footer class="wrap" id="foot"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="analysis.js"></script>
<script src="app.js"></script>
</body>
</html>
