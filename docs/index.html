<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>입찰 전략실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#1d2321; --muted:#5f6864; --line:#dcdad3; --soft:#ecebe5;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#dcefe9; --warn:#b45309; --bad:#b42318; --good:#15803d;
  --chart1:#0f6b5c; --chart2:#c2410c; --chart3:#64748b;
  --mono:"IBM Plex Mono",ui-monospace,monospace; --sans:"IBM Plex Sans KR",system-ui,sans-serif;
  --c-doc:#7347d6; --c-asst:#c93d7e; --c-fly:#c23a3a; --c-robo:#18808b;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121615; --panel:#1a201e; --ink:#e6ebe8; --muted:#9aa5a0; --line:#2c3532; --soft:#222a27;
  --accent:#4fbfa8; --accent-ink:#0c1412; --accent-soft:#1d3a33; --warn:#f59e0b; --bad:#f87171; --good:#4ade80;
  --chart1:#4fbfa8; --chart2:#fb923c; --chart3:#94a3b8;
  --c-doc:#b07cff; --c-asst:#ff86b8; --c-fly:#ef5b5b; --c-robo:#57d0dc; } }
:root[data-theme="dark"]{
  --bg:#121615; --panel:#1a201e; --ink:#e6ebe8; --muted:#9aa5a0; --line:#2c3532; --soft:#222a27;
  --accent:#4fbfa8; --accent-ink:#0c1412; --accent-soft:#1d3a33; --warn:#f59e0b; --bad:#f87171; --good:#4ade80;
  --chart1:#4fbfa8; --chart2:#fb923c; --chart3:#94a3b8;
  --c-doc:#b07cff; --c-asst:#ff86b8; --c-fly:#ef5b5b; --c-robo:#57d0dc; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
a{color:var(--accent)}

/* lock */
#lock{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lockbox{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.lockbox h1{font-size:20px;margin:0 0 4px}
.lockbox p{margin:0 0 20px;color:var(--muted);font-size:14px}
.lockbox input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-family:var(--mono);letter-spacing:.08em}
.lockbox input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;width:100%;margin-top:12px}
.err{color:var(--bad);font-size:14px;min-height:22px;margin-top:10px}

/* app */
#app{display:none}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0 8px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--muted);white-space:nowrap}
@media (max-width:560px){.bar{flex-wrap:wrap;gap:8px}.brand{flex:1 1 100%}.brand small{display:block;margin:2px 0 0}.spacer{display:none}.iconbtn{padding:5px 9px}}
.filters{display:flex;flex-direction:column;gap:8px;padding:4px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .lbl{font-size:12px;color:var(--muted);width:44px;flex:none}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.ghost{border-style:dashed;color:var(--muted)}
.more{display:none;flex-wrap:wrap;gap:6px}
.more.open{display:flex}
#custom{display:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:4px}
#custom.open{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{padding:20px 0 60px}
.scope{font-size:13px;color:var(--muted);margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;font-family:var(--mono);margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 4px}
.card .lead{margin:0 0 14px;color:var(--muted);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.chartbox{position:relative;height:300px}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
@media (max-width:700px){.recs{grid-template-columns:1fr}}
.ctlrow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:10px 0 4px}
.ctl{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.segbtn{border:0;background:var(--panel);padding:5px 12px;cursor:pointer;font-family:var(--mono);font-size:13px;color:var(--ink)}
.segbtn+.segbtn{border-left:1px solid var(--line)}
.segbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.hint{display:block;margin-top:8px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 8px 8px 0;font-size:13px;line-height:1.65;color:var(--ink);word-break:keep-all}
.bands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.band{border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.band.main{border-color:var(--accent);background:var(--accent-soft)}
.band .rk{font-size:12px;color:var(--muted)}
.band .rng{font-size:clamp(15px,1.6vw,20px);font-weight:600;line-height:1.25}
.band .rng span{white-space:nowrap}
.band .cnt{font-size:12px;color:var(--muted)}
.bandsay{margin:-6px 0 12px;font-size:14px}
table.bt th,table.bt td{white-space:nowrap}
td .sub{font-size:12px;color:var(--muted);font-weight:400}
.band.main .rng{font-size:clamp(15px,1.6vw,20px)}
.band .pp{font-size:14px;color:var(--accent);font-weight:600}
@media (max-width:760px){.bands{grid-template-columns:repeat(2,minmax(0,1fr))}.band.main{grid-column:1/-1}.band .rng{font-size:14px}.band.main .rng{font-size:20px}}
.dtools{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:8px}
@media (max-width:860px){.dtools{grid-template-columns:1fr 1fr}}
.dtools .btn{white-space:nowrap}
.dlist table{min-width:980px;font-size:13px}
.dlist td,.dlist th{padding:7px 7px}
.dlist td,.dlist th{white-space:nowrap}
.dlist td.wrap{white-space:normal;min-width:96px;max-width:140px}
.dlist td.wrap.nm{min-width:220px;max-width:300px}
.pill{white-space:nowrap}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
:root[data-theme="dark"] mark{background:#7c5c14}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) mark{background:#7c5c14}}
.rulehelp,.nearlist{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel)}
.rulehelp summary,.nearlist summary{cursor:pointer;font-size:14px;color:var(--accent);font-weight:500}
table.rules td{white-space:normal;font-size:13px}
table.rules code,.card code{font-family:var(--mono);background:var(--soft);padding:1px 6px;border-radius:5px}
h3.sub{font-size:14px;margin:14px 0 6px}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px}
.pager .btn[disabled]{opacity:.4;cursor:default}
.btn.mini{padding:4px 10px;font-size:12px;white-space:nowrap}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rec.main{border-color:var(--accent);background:var(--accent-soft)}
.rec .t{font-size:13px;color:var(--muted)}
.rec .x{font-family:var(--mono);font-size:24px;font-weight:600}
.rec .d{font-size:13px}
.verdict{border-left:4px solid var(--muted);padding:10px 14px;background:var(--soft);border-radius:0 10px 10px 0;font-size:14px}
.verdict.good{border-left-color:var(--good)}
.verdict.bad{border-left-color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{color:var(--warn)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.out{font-family:var(--mono);font-size:20px;font-weight:600}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.progress{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--accent)}
.note{font-size:13px;color:var(--muted)}
/* ---------- 연구실 안내 지도 (guide.js) ---------- */
body.noscroll{overflow:hidden}
.lockhi{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.lockhi img{width:84px;height:84px;flex:none}
.lockhi .bubble{background:var(--soft);border-radius:12px 12px 12px 2px;padding:8px 12px;font-size:13px;color:var(--ink)}
.lockhi .bubble b{color:var(--c-asst)}
#guide{position:fixed;inset:0;z-index:50;display:none;background:var(--bg);overflow-y:auto}
#guide.open{display:block}
.gwrap{max-width:1080px;margin:0 auto;padding:28px 16px 48px;position:relative}
.gclose{position:absolute;right:16px;top:20px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.ghead{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin:8px 0 22px}
.gcast{display:flex;align-items:flex-end}
.gcast img{width:104px;height:104px;margin-right:-22px}
.gkicker{margin:0;color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.04em}
.ghead h2{margin:2px 0 8px;font-size:clamp(20px,3vw,28px);line-height:1.3;word-break:keep-all}
.gsay{margin:0 0 12px;color:var(--muted);font-size:14px;word-break:keep-all}
.gbtns{display:flex;flex-wrap:wrap;gap:8px}
.gbtns .btn.primary{width:auto;margin:0}
.gmap{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:28px 22px;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:18px;
  background-image:radial-gradient(color-mix(in srgb,var(--line) 70%,transparent) 1px,transparent 1px);background-size:18px 18px}
.groute{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.groute path{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round;opacity:.75}
.gstop{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px 12px;background:var(--panel);border:1px solid var(--line);
  border-top:4px solid var(--who);border-radius:14px;cursor:pointer;text-align:center;transition:transform .15s,box-shadow .15s}
.gstop:hover,.gstop:focus-visible{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.gno{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;background:var(--who);color:#fff;font-weight:700;display:grid;place-items:center;font-family:var(--mono);box-shadow:0 0 0 4px var(--panel)}
.gstop img{width:96px;height:96px;margin-top:6px}
.gtitle{font-weight:600;font-size:15px}
.gwho{font-size:12px;color:var(--who)}
/* 2행 뱀 모양: 5~8번은 오른쪽에서 왼쪽으로 */
.gstop[data-i="4"]{grid-row:2;grid-column:4}.gstop[data-i="5"]{grid-row:2;grid-column:3}
.gstop[data-i="6"]{grid-row:2;grid-column:2}.gstop[data-i="7"]{grid-row:2;grid-column:1}
.gnote{font-size:13px;color:var(--muted);margin-top:12px}
@media (max-width:760px){
  .ghead{grid-template-columns:1fr}.gcast img{width:76px;height:76px;margin-right:-16px}
  .gmap{grid-template-columns:1fr 1fr;gap:28px 14px;padding:22px 12px}
  .gstop[data-i]{grid-row:auto;grid-column:auto}
  .gstop img{width:76px;height:76px}
}
#tspot{position:fixed;z-index:60;display:none;border-radius:12px;pointer-events:none;box-shadow:0 0 0 3px var(--accent),0 0 0 9999px rgba(8,12,11,.58);transition:all .25s ease}
#tbub{position:fixed;z-index:61;display:none;width:440px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--who);
  border-radius:14px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.25)}
#tbub{display:none}
#tbub[style*="block"]{display:grid!important;grid-template-columns:84px 1fr;gap:10px;align-items:start}
#tbub img{width:84px;height:84px}
.tmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.tmeta b{color:var(--who)}.tmeta span{font-size:12px;color:var(--muted)}
#tbub p{margin:4px 0 10px;font-size:14px;line-height:1.6;word-break:keep-all}
.tbtns{display:flex;flex-wrap:wrap;gap:6px}
.tbtns .btn{padding:6px 10px;font-size:13px;width:auto;margin:0}
.tbtns .btn[disabled]{opacity:.4;cursor:default}
.tbtns .tnext{margin-left:auto}
#tbub.sheet{left:8px!important;right:8px;bottom:8px;top:auto!important;width:auto!important;grid-template-columns:60px 1fr}
#tbub.sheet img{width:60px;height:60px}
@media (prefers-reduced-motion:reduce){#tspot{transition:none}.gstop{transition:none}}
footer{font-size:12px;color:var(--muted);padding:20px 0 40px}
</style>
</head>
<body>
<section id="lock">
  <form class="lockbox" id="lockform" autocomplete="off">
    <div class="lockhi"><img src="img/char/asst_e13.webp" alt="" aria-hidden="true"><div class="bubble"><b>조수 하루</b><br>어서 오세요. 비밀번호를 넣으면 연구실 문이 열려요.</div></div>
    <h1>입찰 전략실</h1>
    <p>내부 전용입니다. 비밀번호를 입력하면 데이터가 열립니다.</p>
    <input id="pw" type="password" inputmode="text" placeholder="비밀번호" aria-label="비밀번호" autofocus>
    <button class="btn primary" id="unlock" type="submit">열기</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>

<div id="app">
  <header class="top">
    <div class="wrap">
      <div class="bar">
        <div class="brand">입찰 전략실<small id="asof"></small></div>
        <div class="spacer"></div>
        <button class="iconbtn" id="guidebtn" title="안내 지도 열기">사용법</button>
        <button class="iconbtn" id="theme" title="화면 밝기">밝기</button>
        <button class="iconbtn" id="lockbtn">잠그기</button>
      </div>
      <div class="filters">
        <div class="row" id="catrow"><span class="lbl">업종</span></div>
        <div class="more" id="morerow"></div>
        <div id="custom">
          <div class="grid">
            <div class="field"><label>공고명 키워드 ( + 는 모두, 쉼표는 하나라도, 띄어쓰기 무시)</label><input id="c_inc" placeholder="예: 전기+감리, 소방+감리"></div>
            <div class="field"><label>제외 키워드</label><input id="c_exc" placeholder="예: 통신, 물품"></div>
            <div class="field"><label>업무구분</label><select id="c_div"><option value="">전체</option><option>공사</option><option>용역</option></select></div>
            <div class="field"><label>투찰가능 업종 포함</label><input id="c_ind" placeholder="예: 전기공사업"></div>
            <div class="field"><label>발주기관 포함</label><input id="c_inst" placeholder="예: 한국전력, 교육청"></div>
            <div class="field"><label>참가가능 지역 포함</label><input id="c_rgn" placeholder="예: 경기"></div>
            <div class="field"><label>기초금액 하한 (억원)</label><input id="c_min" type="number" step="0.1" min="0"></div>
            <div class="field"><label>기초금액 상한 (억원)</label><input id="c_max" type="number" step="0.1" min="0"></div>
            <div class="field"><label>낙찰자결정방법 포함</label><input id="c_mth" placeholder="예: 적격심사"></div>
          </div>
          <details class="rulehelp" id="c_help"><summary>키워드 규칙 보기 — 전기+감리 · 전기+감리자 · 전기감리자는 어떻게 다른가요?</summary><div id="c_rules"></div>
            <p class="note">실제로 어떤 공고가 잡히고 빠졌는지는 <button type="button" class="btn mini" id="c_check">데이터 목록 → 검색어 확인</button>에서 볼 수 있습니다.</p></details>
        </div>
        <div class="row" id="perrow"><span class="lbl">기간</span></div>
      </div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
    </div>
  </header>
  <main class="wrap">
    <div class="scope" id="scope"></div>
    <div id="view"></div>
  </main>
  <footer class="wrap" id="foot"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="analysis.js"></script>
<script src="guide.js"></script>
<script src="app.js"></script>
</body>
</html>
